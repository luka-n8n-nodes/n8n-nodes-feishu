# Publishes this n8n community node package to npm with provenance.
#
# Triggers:
#   1. Push of a version tag (v0.1.0 / 0.1.0)
#   2. Manual "Run workflow" — bumps version, pushes tag, which then triggers (1)
#
# Starting May 1 2026, n8n requires community nodes to be published via
# GitHub Actions with npm provenance. This workflow satisfies that requirement.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended):
#   1. npmjs.com → package settings → Publish access → Trusted Publishers
#   2. Add GitHub Actions publisher:
#        Repository owner: luka-n8n-nodes
#        Repository name:  n8n-nodes-feishu
#        Workflow name:    publish.yml
#        Environment:      正式环境
#   3. Do not set NPM_TOKEN if using OIDC.
#
# Option B — npm Automation Token:
#   Create a granular access token and store it as NPM_TOKEN in repo secrets.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# From GitHub Actions UI (same as before):
#   Actions → Publish → Run workflow → choose patch / minor / major
#
# Or locally (n8n starter style):
#   npm run release
#   → bumps, tags, pushes → this workflow publishes to npm

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version_type:
        description: '版本类型'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  # Manual trigger: bump version + push tag. The tag push starts the publish job.
  bump:
    name: Bump version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.email "luka.cat.mimi@gmail.com"
          git config user.name "luka-cat"

      - name: Bump version and push tag
        run: |
          NEW_VERSION=$(npm version "${{ github.event.inputs.version_type }}" -m "chore: release %s")
          echo "Created $NEW_VERSION — pushing commit and tag to trigger publish"
          git push origin HEAD:main --follow-tags

  publish:
    name: Publish to npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: 正式环境
      url: https://www.npmjs.com/package/@luka-cat-mimi/n8n-nodes-feishu

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        # In GITHUB_ACTIONS, `npm run release` runs lint + build + npm publish
        # with NPM_CONFIG_PROVENANCE=true (requires @n8n/node-cli >= 0.23.0).
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
