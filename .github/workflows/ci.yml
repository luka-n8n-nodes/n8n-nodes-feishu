name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        # Skip dependency install scripts: the native isolated-vm module (pulled in by
        # n8n-workflow) is only used inside n8n at runtime and fails to compile on Node
        # versions without a prebuilt binary. Lint and build do not need it.
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
